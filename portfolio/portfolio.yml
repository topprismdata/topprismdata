pillars:
  - id: world_model_to_decision
    title_en: World Model → Decision
    title_zh: 世界模型 → 决策
    description_en: Model the physical business world, then turn states, constraints and objectives into decisions.
    description_zh: 建模真实业务世界，再把状态、约束和目标转化为可解释的决策。
    flow_en: Business world → world model → constraints & objectives → decision engine → feedback
    flow_zh: 业务世界 → 世界模型 → 约束与目标 → 决策引擎 → 反馈
  - id: native_ai
    title_en: Native AI
    title_zh: Native AI
    description_en: Turn project experience into knowledge, reusable skills and stronger agents.
    description_zh: 把项目经验沉淀为知识、可复用技能和更强的智能体。
    flow_en: Project → experience → knowledge → reusable skill → stronger agent
    flow_zh: 项目 → 经验 → 知识 → 可复用技能 → 更强智能体

